<article class="card-island island-style floating-island" style="animation-delay: {{delay}}s;">
    <div class="card-icon" style="font-size: 2.5rem; margin-bottom: var(--spacing-sm); display: block; text-align: center;">
        {{icon}}
    </div>
    <h3 class="h3-island" style="text-align: center; margin-bottom: var(--spacing-sm);">{{title}}</h3>
    <div class="lesson-content">
        <h4 class="h4-island">{{subtitle}}</h4>
        <p class="text-island" style="line-height: 1.6; margin-bottom: var(--spacing-md);">{{content}}</p>
        {{#if example}}
        <div class="example-box" style="background: rgba(90, 206, 74, 0.1); border-radius: var(--radius-md); padding: var(--spacing-sm); margin-top: var(--spacing-sm); border-left: 3px solid var(--accent-green);">
            <h4 class="h4-island">{{example.title}}</h4>
            <p class="text-island" style="font-size: var(--font-size-small); line-height: 1.5; margin: 0;">{{example.text}}</p>
        </div>
        {{/if}}
    </div>
    {{#if status}}
    <div class="card-status" style="text-align: center; margin-top: auto;">
        <span class="badge-island {{status.class}}">{{status.text}}</span>
    </div>
    {{/if}}
</article>
