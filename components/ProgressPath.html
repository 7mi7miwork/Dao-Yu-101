<section class="content-section island-style floating-island">
    <h2 class="h2-island">{{title}}</h2>
    <p class="text-island" style="text-align: center; font-size: var(--font-size-body); margin-bottom: var(--spacing-lg); max-width: 700px; margin-left: auto; margin-right: auto;">
        {{description}}
    </p>
    <div class="progress-path-container" style="display: flex; flex-direction: column; gap: var(--spacing-lg); margin-top: var(--spacing-lg);">
        {{{levels}}}
    </div>
</section>
