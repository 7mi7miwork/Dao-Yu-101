<article class="card-island island-style floating-island" style="animation-delay: {{delay}}s;">
    <div class="card-icon" style="font-size: 2.5rem; margin-bottom: var(--spacing-sm); display: block; text-align: center;">
        {{icon}}
    </div>
    <h3 class="h3-island" style="text-align: center; margin-bottom: var(--spacing-sm);">{{title}}</h3>
    <p class="text-island" style="line-height: 1.6; margin-bottom: var(--spacing-md); text-align: center;">{{description}}</p>
    {{#if status}}
    <div class="card-status" style="text-align: center; margin-top: auto;">
        <span class="badge-island {{status.class}}">{{status.text}}</span>
    </div>
    {{/if}}
</article>
